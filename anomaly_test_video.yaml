source:
  # 실제 파일은 실행 시 --source-video로 지정
  split: "val"

generation:
  seed: 342

  # Gate metadata가 2fps라면
  # 현재 frame에서 가장 가까운 homography를 사용
  max_metadata_gap_sec: 0.75

events:

