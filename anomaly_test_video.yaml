  # LEFT - 물방울
  # ---------------------------------------------------------
  - id: "left_droplet"
    roi: "left"
    defect_type: "droplet"

    start_sec: 8.0
    end_sec: 15.0

    width_ratio_min: 0.08
    width_ratio_max: 0.16

    rotation_min: -30
    rotation_max: 30

    opacity_min: 0.70
    opacity_max: 0.95

    zone:
      - 0.10
      - 0.10
      - 0.90
      - 0.80


  # ---------------------------------------------------------
  # RIGHT - 지속 누수
  # ---------------------------------------------------------
  - id: "right_leak"
    roi: "right"
    defect_type: "leak"

    start_sec: 22.0
    end_sec: 32.0

    width_ratio_min: 0.15
    width_ratio_max: 0.28

    rotation_min: -12
    rotation_max: 12

    opacity_min: 0.70
    opacity_max: 0.95

    zone:
      - 0.10
      - 0.05
      - 0.90
      - 0.50


  # ---------------------------------------------------------
  # LEFT - 물 튐
  # ---------------------------------------------------------
